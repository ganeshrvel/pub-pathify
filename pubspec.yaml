name: pathify
description: A byte-level, cross-platform path manipulation library for Dart, ported from Rust's std::path.
version: 1.0.5
homepage: https://github.com/ganeshrvel/pub-pathify

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  meta: ^1.18.0
  option_result: ^3.3.0

dev_dependencies:
  very_good_analysis: ^10.2.0
  test: ^1.30.0
  benchmark_harness_plus: any

platforms:
  linux:
  macos:
  windows:
  android:
  ios:
